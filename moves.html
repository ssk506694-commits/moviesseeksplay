<style>
  /* ডার্ক ও লাইট মোডের কালার ভেরিয়েবল */
  :root {
    --bg-color-1: #ff4b4b; 
    --bg-color-2: #4b4bff; 
    --card-bg: #ffffff;
    --text-color: #333333;
    --btn-text: #ffffff;
  }
  
  body.dark-mode {
    --bg-color-1: #4a0000;
    --bg-color-2: #00004a;
    --card-bg: #222222;
    --text-color: #f1f1f1;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
    color: var(--text-color);
    background: linear-gradient(45deg, var(--bg-color-1), var(--bg-color-2));
    background-size: 200% 200%;
    animation: gradientMove 5s ease infinite;
    min-height: 100vh;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* টপ বার (সার্চ এবং ডার্ক মোড টগল সুইচ) */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    background: rgba(255, 255, 255, 0.1);
    padding: 10px 20px;
    border-radius: 12px;
    backdrop-filter: blur(5px);
  }
  
  #searchBox {
    flex-grow: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    outline: none;
  }

  /* টগল সুইচ ডিজাইন */
  .toggle-container {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 28px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 34px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: #2196F3; }
  input:checked + .slider:before { transform: translateX(22px); }

  /* মুভি কন্টেইনার */
  .movie-container {
    display: flex;
    flex-direction: column;
    gap: 30px;
    max-width: 600px; /* সিঙ্গেল কলামের জন্য পারফেক্ট সাইজ */
    margin: 0 auto;
  }

  /* ভার্চুয়াল প্লেসহোল্ডার (এর ভেতরে কার্ড লোড হবে এবং ডিলিট হবে) */
  .card-placeholder {
    min-height: 550px; /* কার্ডের আনুমানিক উচ্চতা যাতে স্ক্রল স্মুথ থাকে */
    width: 100%;
  }

  .movie-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: transform 0.2s ease;
    opacity: 0; /* অ্যানিমেশনের জন্য */
  }
  
  .movie-card:hover { transform: scale(1.02); }

  /* স্ক্রল অ্যানিমেশন */
  .slide-from-left { animation: slideLeftAnim 0.6s forwards; }
  .slide-from-right { animation: slideRightAnim 0.6s forwards; }

  @keyframes slideLeftAnim {
    from { transform: translateX(-100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideRightAnim {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .movie-poster {
    width: 100%;
    height: 400px;
    object-fit: cover;
    border-radius: 8px;
    background: #e0e0e0;
  }

  .movie-title {
    font-size: 1.5em;
    margin: 15px 0;
    text-align: center;
    font-weight: bold;
    line-height: 1.2;
  }

  /* বাটনগুলো সাইড-বাই-সাইড */
  .movie-buttons {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    gap: 10px;
  }
  
  .movie-buttons a {
    flex: 1;
    text-align: center;
    padding: 12px 5px;
    border-radius: 8px;
    color: var(--btn-text);
    text-decoration: none;
    font-weight: bold;
    transition: opacity 0.2s;
    font-size: 14px;
  }
  
  .movie-buttons a:hover { opacity: 0.8; }
  .btn-preview { background-color: #ff9800; }
  .btn-watch { background-color: #e50914; }
  .btn-download { background-color: #4caf50; }

  #status-message {
    text-align: center;
    color: white;
    font-weight: bold;
    font-size: 18px;
    margin-top: 20px;
  }
</style>

<div class="top-bar">
  <input type="text" id="searchBox" placeholder="মুভি খুঁজুন...">
  <div class="toggle-container">
    <span>🌙</span>
    <label class="switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div id="movie-container" class="movie-container"></div>
<div id="status-message">লোড হচ্ছে...</div>

<script>
  const sheetId = '1XKI9EmngzuXG29RDT4KuyuB2oNi6Nob3GNFfERYS3Wk';
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

  let allMovies = [];
  let filteredMovies = [];
  let lastScrollY = window.scrollY;

  // ডার্ক মোড টগল লজিক
  const darkModeToggle = document.getElementById('darkModeToggle');
  darkModeToggle.addEventListener('change', (e) => {
    if(e.target.checked) {
      document.body.classList.add('dark-mode');
    } else {
      document.body.classList.remove('dark-mode');
    }
  });

  // গুগল শিট থেকে ডেটা আনা
  fetch(url)
    .then(res => res.text())
    .then(text => {
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;
      
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i].c;
        if (row && row[0] && row[0].v) {
          
          let rawTitle = row[0].v;
          // স্পেশাল ক্যারেক্টার রিমুভ করে স্পেস বসানো
          let cleanTitle = rawTitle.replace(/[^a-zA-Z0-9\u0980-\u09FF]/g, ' ').replace(/\s+/g, ' ').trim();

          allMovies.push({
            title: cleanTitle,
            poster: row[1] ? row[1].v : '',
            preview: row[2] ? row[2].v : '',
            download: row[3] ? row[3].v : '',
            watch: row[4] ? row[4].v : ''
          });
        }
      }
      filteredMovies = [...allMovies];
      renderPlaceholders();
      document.getElementById('status-message').style.display = 'none';
    })
    .catch(err => {
      document.getElementById('status-message').innerText = "ডেটা লোড করতে সমস্যা হয়েছে!";
    });

  // কার্ডের এইচটিএমএল স্ট্রাকচার তৈরির ফাংশন
  function getCardHTML(movie) {
    return `
      <div class="movie-card" onclick="if('${movie.watch}') window.open('${movie.watch}', '_blank');">
        <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" loading="lazy">
        <h3 class="movie-title">${movie.title}</h3>
        <div class="movie-buttons">
          ${movie.preview ? `<a href="${movie.preview}" target="_blank" class="btn-preview" onclick="event.stopPropagation()">Preview</a>` : ''}
          ${movie.watch ? `<a href="${movie.watch}" target="_blank" class="btn-watch" onclick="event.stopPropagation()">Watch</a>` : ''}
          ${movie.download ? `<a href="${movie.download}" target="_blank" class="btn-download" onclick="event.stopPropagation()">Download</a>` : ''}
        </div>
      </div>
    `;
  }

  // DOM Virtualization & Animation Observer
  const scrollObserver = new IntersectionObserver((entries) => {
    const currentScrollY = window.scrollY;
    const scrollingDown = currentScrollY > lastScrollY;
    
    entries.forEach(entry => {
      const index = entry.target.dataset.index;
      
      // যখন কার্ড স্ক্রিনে আসছে (অথবা স্ক্রিনের খুব কাছাকাছি)
      if (entry.isIntersecting) {
        if (entry.target.innerHTML === '') {
          entry.target.innerHTML = getCardHTML(filteredMovies[index]);
          const cardElement = entry.target.querySelector('.movie-card');
          
          // অ্যানিমেশন সেট করা
          if (scrollingDown) {
            cardElement.classList.add('slide-from-left');
          } else {
            cardElement.classList.add('slide-from-right');
          }
        }
      } 
      // যখন কার্ড স্ক্রিন থেকে অনেক দূরে চলে যাচ্ছে (Memory Save করার জন্য ডিলিট)
      else {
        if (entry.target.innerHTML !== '') {
           // ভেতরের HTML মুছে দেওয়া হলো, কিন্তু বাইরের div এর height বজায় থাকবে
          entry.target.innerHTML = ''; 
        }
      }
    });
    
    lastScrollY = currentScrollY;
  }, { 
    // স্ক্রিনের ৪০০ পিক্সেল ওপর বা নিচ পর্যন্ত কার্ডগুলো রেন্ডার হয়ে থাকবে
    rootMargin: '400px 0px 400px 0px' 
  });

  // সার্চ বা ডেটা লোড হলে প্লেসহোল্ডার তৈরি করা
  function renderPlaceholders() {
    const container = document.getElementById('movie-container');
    container.innerHTML = ''; // আগের সব মুছে ফেলা
    
    if(filteredMovies.length === 0) {
       container.innerHTML = '<h3 style="color:white; text-align:center;">কোনো মুভি পাওয়া যায়নি</h3>';
       return;
    }

    filteredMovies.forEach((movie, index) => {
      const placeholder = document.createElement('div');
      placeholder.className = 'card-placeholder';
      placeholder.dataset.index = index; // ইনডেক্স সেভ করে রাখা
      container.appendChild(placeholder);
      
      // অবজাভার চালু করা
      scrollObserver.observe(placeholder);
    });
  }

  // লাইভ সার্চ ফাংশন
  document.getElementById('searchBox').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(term));
    renderPlaceholders();
  });
</script>
