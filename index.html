<style>
  /* ডার্ক ও লাইট মোডের কালার ভেরিয়েবল */
  :root {
    --bg-color-1: #ff4b4b; 
    --bg-color-2: #4b4bff; 
    --card-bg: rgba(255, 255, 255, 0.85);
    --text-color: #222222;
    --btn-text: #ffffff;
  }
  
  body.dark-mode {
    --bg-color-1: #4a0000;
    --bg-color-2: #00004a;
    --card-bg: rgba(0, 0, 0, 0.75);
    --text-color: #f1f1f1;
  }

  body {
    margin: 0;
    padding: 15px 8px; 
    font-family: sans-serif;
    color: var(--text-color);
    background: linear-gradient(45deg, var(--bg-color-1), var(--bg-color-2));
    background-size: 200% 200%;
    animation: gradientMove 5s ease infinite;
    min-height: 100vh;
    box-sizing: border-box;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* টপ বার */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
    max-width: 800px; 
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    background: rgba(255, 255, 255, 0.2);
    padding: 15px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-sizing: border-box;
  }
  
  /* সার্চ বক্স বড় করা হয়েছে */
  #searchBox {
    flex-grow: 1;
    padding: 16px; /* প্যাডিং বাড়ানো হয়েছে */
    border-radius: 10px;
    border: none;
    font-size: 18px; /* ফন্ট বড় করা হয়েছে */
    font-weight: bold;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    outline: none;
    width: 100%;
  }

  /* টগল সুইচ একটু বড় করা হয়েছে */
  .toggle-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 24px;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 56px;
    height: 30px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 34px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 22px;
    width: 22px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: #2196F3; }
  input:checked + .slider:before { transform: translateX(26px); }

  /* মুভি কন্টেইনার */
  .movie-container {
    display: flex;
    flex-direction: column;
    gap: 25px;
    max-width: 800px; 
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  /* ভার্চুয়াল প্লেসহোল্ডার */
  .card-placeholder {
    min-height: 450px; 
    width: 100%;
  }

  /* কার্ড ডিজাইন */
  .movie-card {
    background: var(--card-bg);
    border-radius: 20px; 
    padding: 20px;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    backdrop-filter: blur(10px); 
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    transition: transform 0.2s ease;
    opacity: 0; 
    width: 100%;
    box-sizing: border-box;
  }
  
  .movie-card:hover { transform: scale(1.02); }

  /* স্ক্রল অ্যানিমেশন */
  .slide-from-left { animation: slideLeftAnim 0.6s forwards; }
  .slide-from-right { animation: slideRightAnim 0.6s forwards; }

  @keyframes slideLeftAnim {
    from { transform: translateX(-100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideRightAnim {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ইমেজের সাইজ ইউটিউব থাম্বনেইলের মতো (16:9) এবং স্ট্রেচ (fill) */
  .movie-poster {
    width: 100%;
    aspect-ratio: 16 / 9; 
    object-fit: fill; 
    border-radius: 12px;
    background: #e0e0e0;
  }

  /* টাইটেল বড় করা হয়েছে */
  .movie-title {
    font-size: 1.7em; /* ফন্ট আরও বড় করা হয়েছে */
    margin: 18px 0;
    text-align: center;
    font-weight: 800;
    line-height: 1.3;
  }

  /* বাটনগুলো বড় করা হয়েছে */
  .movie-buttons {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }
  
  .movie-buttons a {
    flex: 1;
    text-align: center;
    padding: 16px 8px; /* বাটন প্যাডিং বাড়ানো হয়েছে */
    border-radius: 12px;
    color: var(--btn-text);
    text-decoration: none;
    font-weight: bold;
    font-size: 18px; /* বাটন ফন্ট বড় করা হয়েছে */
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  
  .movie-buttons a:active { transform: scale(0.95); }
  .movie-buttons a:hover { opacity: 0.8; }
  .btn-preview { background-color: #ff9800; }
  .btn-watch { background-color: #e50914; }
  .btn-download { background-color: #4caf50; }

  #status-message {
    text-align: center;
    color: white;
    font-weight: bold;
    font-size: 20px;
    margin-top: 20px;
  }

  /* ছোট স্ক্রিনের জন্য ফন্ট যেন খুব ছোট না হয় তার ব্যবস্থা */
  @media (max-width: 380px) {
    .movie-buttons { gap: 10px; }
    .movie-buttons a { font-size: 16px; padding: 14px 4px; }
    #searchBox { font-size: 16px; padding: 14px; }
    .movie-title { font-size: 1.5em; }
    body { padding: 10px 5px; } 
  }
</style>

<div class="top-bar">
  <input type="text" id="searchBox" placeholder="Search Movies...">
  <div class="toggle-container">
    <span>🌙</span>
    <label class="switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div id="movie-container" class="movie-container"></div>
<div id="status-message">লোড হচ্ছে...</div>

<script>
  const sheetId = '1XKI9EmngzuXG29RDT4KuyuB2oNi6Nob3GNFfERYS3Wk';
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

  const CACHE_KEY = 'jasTvMovieData';
  const CACHE_TIME_KEY = 'jasTvCacheTime';
  const ONE_DAY_MS = 24 * 60 * 60 * 1000;

  let allMovies = [];
  let filteredMovies = [];
  let lastScrollY = window.scrollY;

  // ডার্ক মোড টগল 
  const darkModeToggle = document.getElementById('darkModeToggle');
  darkModeToggle.addEventListener('change', (e) => {
    if(e.target.checked) {
      document.body.classList.add('dark-mode');
    } else {
      document.body.classList.remove('dark-mode');
    }
  });

  // ডেটা লোড ফাংশন (Cache Check)
  function loadData() {
    const cachedData = localStorage.getItem(CACHE_KEY);
    const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
    const now = new Date().getTime();

    if (cachedData && cacheTime && (now - cacheTime < ONE_DAY_MS)) {
      allMovies = JSON.parse(cachedData);
      filteredMovies = [...allMovies];
      renderPlaceholders();
      document.getElementById('status-message').style.display = 'none';
    } else {
      fetchDataFromSheet();
    }
  }

  // গুগল শিট থেকে ডেটা আনা
  function fetchDataFromSheet() {
    fetch(url)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;
        let fetchedMovies = [];
        
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i].c;
          if (row && row[0] && row[0].v) {
            
            let rawTitle = row[0].v;
            
            let cleanTitle = rawTitle.replace(/\b(mp4|1080p|720p|24fps|mkv)\b/gi, ' ');
            cleanTitle = cleanTitle.replace(/[^a-zA-Z0-9\u0980-\u09FF]/g, ' ');
            cleanTitle = cleanTitle.replace(/\s+/g, ' ').trim();

            fetchedMovies.push({
              title: cleanTitle,
              poster: row[1] ? row[1].v : '',
              preview: row[2] ? row[2].v : '',
              download: row[3] ? row[3].v : '',
              watch: row[4] ? row[4].v : ''
            });
          }
        }
        
        localStorage.setItem(CACHE_KEY, JSON.stringify(fetchedMovies));
        localStorage.setItem(CACHE_TIME_KEY, new Date().getTime().toString());

        allMovies = fetchedMovies;
        filteredMovies = [...allMovies];
        renderPlaceholders();
        document.getElementById('status-message').style.display = 'none';
      })
      .catch(err => {
        document.getElementById('status-message').innerText = "ডেটা লোড করতে সমস্যা হয়েছে!";
      });
  }

  loadData();

  // কার্ড এইচটিএমএল
  function getCardHTML(movie) {
    return `
      <div class="movie-card" onclick="if('${movie.watch}') window.open('${movie.watch}', '_blank');">
        <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" loading="lazy">
        <h3 class="movie-title">${movie.title}</h3>
        <div class="movie-buttons">
          ${movie.preview ? `<a href="${movie.preview}" target="_blank" class="btn-preview" onclick="event.stopPropagation()">Preview</a>` : ''}
          ${movie.watch ? `<a href="${movie.watch}" target="_blank" class="btn-watch" onclick="event.stopPropagation()">Watch</a>` : ''}
          ${movie.download ? `<a href="${movie.download}" target="_blank" class="btn-download" onclick="event.stopPropagation()">Download</a>` : ''}
        </div>
      </div>
    `;
  }

  // DOM Virtualization 
  const scrollObserver = new IntersectionObserver((entries) => {
    const currentScrollY = window.scrollY;
    const scrollingDown = currentScrollY > lastScrollY;
    
    entries.forEach(entry => {
      const index = entry.target.dataset.index;
      
      if (entry.isIntersecting) {
        if (entry.target.innerHTML === '') {
          entry.target.innerHTML = getCardHTML(filteredMovies[index]);
          const cardElement = entry.target.querySelector('.movie-card');
          
          if (scrollingDown) {
            cardElement.classList.add('slide-from-left');
          } else {
            cardElement.classList.add('slide-from-right');
          }
        }
      } 
      else {
        if (entry.target.innerHTML !== '') {
          entry.target.innerHTML = ''; 
        }
      }
    });
    
    lastScrollY = currentScrollY;
  }, { 
    rootMargin: '400px 0px 400px 0px' 
  });

  function renderPlaceholders() {
    const container = document.getElementById('movie-container');
    container.innerHTML = ''; 
    
    if(filteredMovies.length === 0) {
       container.innerHTML = '<h3 style="color:white; text-align:center;">কোনো মুভি পাওয়া যায়নি</h3>';
       return;
    }

    filteredMovies.forEach((movie, index) => {
      const placeholder = document.createElement('div');
      placeholder.className = 'card-placeholder';
      placeholder.dataset.index = index;
      container.appendChild(placeholder);
      
      scrollObserver.observe(placeholder);
    });
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(term));
    renderPlaceholders();
  });
</script>
