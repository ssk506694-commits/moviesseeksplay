<div id="dynamic-content">
  <p>কোড লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
</div>

<script>
  // আপনার গুগল শিটের আইডি
  const sheetId = '1NfMriwtQSus8ECG8VTOTvZXyTjWKVmtZmZzyiVhHHb8';
  // এখানে ব্যাকটিক () ব্যবহার করা হয়েছে URL এর জন্য
  const url = https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
  
  const cacheKey = 'my_blogger_unique_cache_data_v1';
  const dateKey = 'my_blogger_last_fetch_date';

  function renderCode(htmlContent) {
    const container = document.getElementById('dynamic-content');
    container.innerHTML = htmlContent;
    
    const scripts = container.querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(attr => {
        newScript.setAttribute(attr.name, attr.value);
      });
      if (oldScript.innerHTML) {
        newScript.innerHTML = oldScript.innerHTML;
      }
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  function fallbackToCache(errorMessage) {
    const cachedData = localStorage.getItem(cacheKey);
    if (cachedData) {
      console.log('Loading from cache...');
      renderCode(cachedData);
    } else {
      document.getElementById('dynamic-content').innerHTML = errorMessage;
    }
  }

  function fetchFromSheetAndCache() {
    fetch(url)
      .then(response => response.text())
      .then(text => {
        // রেসপন্স থেকে JSON অংশটুকু বের করা
        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\)/);
        if (match && match[1]) {
          const data = JSON.parse(match[1]);
          if (data.table.rows[0] && data.table.rows[0].c[0]) {
            const htmlCode = data.table.rows[0].c[0].v;
            localStorage.setItem(cacheKey, htmlCode);
            localStorage.setItem(dateKey, new Date().toDateString());
            renderCode(htmlCode);
          } else {
            fallbackToCache('<p>শিটে কোনো কোড পাওয়া যায়নি!</p>');
          }
        }
      })
      .catch(error => {
        console.error('Error:', error);
        fallbackToCache('<p>কোড লোড করতে ব্যর্থ হয়েছে।</p>');
      });
  }

  const todayDate = new Date().toDateString();
  const lastFetchDate = localStorage.getItem(dateKey);

  if (lastFetchDate === todayDate) {
    const cachedData = localStorage.getItem(cacheKey);
    if (cachedData) {
      renderCode(cachedData);
    } else {
      fetchFromSheetAndCache();
    }
  } else {
    fetchFromSheetAndCache();
  }
</script>
