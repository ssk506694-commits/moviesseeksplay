<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { background: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        #loader { font-size: 20px; font-weight: bold; padding: 15px 30px; background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="loader">Loading...</div>

    <script>
        const url = 'https://docs.google.com/spreadsheets/d/1NfMriwtQSus8ECG8VTOTvZXyTjWKVmtZmZzyiVhHHb8/gviz/tq?tqx=out:json&range=A1';
        
        fetch(url)
            .then(res => res.text())
            .then(text => {
                const json = JSON.parse(text.substring(47).slice(0, -2));
                const code = json.table.rows[0]?.c[0]?.v;
                
                if (code) {
                    document.open();
                    document.write(code);
                    document.close();
                } else {
                    document.getElementById('loader').innerText = "Error: Sheet is empty!";
                }
            })
            .catch(() => {
                document.getElementById('loader').innerText = "Error fetching data! Check internet.";
            });
    </script>

</body>
</html>
